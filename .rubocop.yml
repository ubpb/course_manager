inherit_gem:
  rubocop-ubpb: rails.yml

# Add to the inherited excludes instead of replacing them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Generator output, kept as generated.
    - "config/initializers/simple_form*.rb"
    - "db/migrate/**/*"

# Tests deliberately check several aspects of one behaviour at once.
Minitest/MultipleAssertions:
  Enabled: false

# The UI is German; flash messages and texts are written in place.
Rails/I18nLocaleTexts:
  Enabled: false

# Tests set up states such as anonymized registrations directly.
Rails/SkipsModelValidations:
  Exclude:
    - "test/**/*"
