# Shared values get merged with the environment-specific values below
shared:
  color_mode:
    enabled: true

  locale_switching:
    enabled: false

  default_contact:
    name: "Schulungsteam"
    email: "schulung@ub.uni-paderborn.de"
    phone: "05251 60-2017"

  default_call_to_action:
    text: "Selbstlernkurs öffnen"

  # The library as a schema.org entity, emitted as JSON-LD on the home page and
  # referenced by every other structured data block. `same_as` should list the
  # official profiles of the library (Wikidata, social media, ...).
  organization:
    name: "Universitätsbibliothek Paderborn"
    alternate_name: "UB Paderborn"
    url: "https://www.ub.uni-paderborn.de"
    same_as: []

# Values for the development environment
development:
  alma_api:
    api_key: <%= Rails.application.credentials.dig("alma_api", "testing", "api_key") %>

# Values for the production environment
production:
  alma_api:
    api_key: <%= Rails.application.credentials.dig("alma_api", "production", "api_key") %>
