# Defaults for all database connections.
#
# Connection details can be overridden via ENV vars (used by CI, where MySQL
# is reachable over TCP instead of a local socket).
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_general_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  socket: <%= ENV["DB_HOST"].to_s.empty? ? ENV.fetch("DB_SOCKET", "/tmp/mysql.sock") : nil %>

# Settings for the local development environment.
development:
  primary:
    <<: *default
    database: course_manager_development

# Settings for the local testing environment.
# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: course_manager_test
