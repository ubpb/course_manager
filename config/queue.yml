# Solid Queue processes, started by bin/jobs (in production as the systemd user
# service course_manager-jobs, see lib/capistrano/tasks/jobs.rake).
#
# The app sends a few mails a day, so one worker with two threads is plenty, and
# polling every two seconds keeps the load on the shared database negligible.
default: &default
  dispatchers:
    - polling_interval: 2
      batch_size: 500
  workers:
    - queues: "*"
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
