      offer:
        events_on_request: "Termine auf Anfrage?"
        contact_name: "Kontakt"
        contact_email: "E-Mail"
        contact_phone: "Telefon"
        type: "Art"
        call_to_action_url: "Call to Action URL"
        call_to_action_text: "Call to Action Text"
    hints:
      defaults:
        email_from: >
          Die Adresse wird dem Empfänger als 'Antwort an' angezeigt. Diese muss auf '@ub.uni-paderborn.de' enden.
          Als Standard wird schulungen@ub.uni-paderborn.de verwendet.
        confirmation_message: >
          Optionaler Zusatztext, der an die automatische Anmeldebestätigung angehängt wird (z.B. Zugangsdaten oder
          Hinweise zur Vorbereitung). Bleibt das Feld leer, wird nur der Standardtext versendet. Sie können
          <code>###NAME###</code>, <code>###ANREDE###</code>, <code>###DATUM###</code>, <code>###UHRZEIT###</code>, <code>###DAUER###</code>,
          <code>###TREFFPUNKT###</code> und <code>###TITEL###</code> als Platzhalter verwenden.
        max_no_of_participants: >
          0 => Keine Beschränkung
        duration: >
          ... in Minuten
        online_url: >
          Der Link, über den die Teilnehmer der Online-Veranstaltung beitreten (z.B. Zoom oder BigBlueButton).
          Muss mit <code>https://</code> oder <code>http://</code> beginnen.
        user_notes: >
          Notizen, die für den Nutzer sichtbar sind
        internal_notes: >
          Interne Notizen, die nur für Mitarbeiter sichtbar sind
        field_of_interest: >
          Um die Schulung für Sie passgenau vorbereiten zu können, bitte wir Sie, uns Ihren
          Studiengang, Ihre Fakultät/Institut/Department, oder einfach Ihren Interessenschwerpunkt
          (z.B. "Digital Humanities", oder "Mathematik") zu nennen.
      registration:
        user_notes: "Was möchten Sie uns noch mitteilen?"
        gdrp_consent: >
          Ich willige hiermit ein (Art. 6 Abs. 1 lit. a DSGVO), dass meine übermittelten persönlichen Daten verarbeitet und
          gespeichert werden dürfen. Ich versichere, dass ich über 16 Jahre alt bin bzw. die Zustimmung der / des
          Sorgeberechtigten zur Anmeldung zur Schulung und Weitergabe der Daten vorliegt. Die <a href="https://ub.uni-paderborn.de/datenschutz" target="_blank">Datenschutzerklärung</a>
          habe ich gelesen. Das Recht des Widerrufs ist mir bekannt.
      offer:
        description: >
          Formatierungen mit <a href="https://www.markdownguide.org/basic-syntax" target="_blank">Markdown</a> möglich
        learning_targets: >
          Formatierungen mit <a href="https://www.markdownguide.org/basic-syntax" target="_blank">Markdown</a> möglich
        call_to_action_url: >
          Die URL, die beim Klick auf den Call to Action Button geöffnet wird.
          Muss mit <code>https://</code> oder <code>http://</code> beginnen.
          Wenn leer, wird der Button nicht angezeigt.
        call_to_action_text: >
          Der Text, der auf dem Call to Action Button angezeigt wird.
    options:
      filter:
        date_range:
          week: "... in der nächsten 7 Tagen"
          month: "... in den nächsten 4 Wochen"
          quarter: "... in den nächsten 3 Monaten"
