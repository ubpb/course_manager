# Recurring tasks, run by Solid Queue's scheduler (part of bin/jobs). They
# replace the crontab entries on the server. Schedules without a time zone are
# read in the app's time zone (config.time_zone = "Berlin").
#
# By hand: bin/rails app:mailer:send_reminder_messages / bin/rails app:dsgvo:cleanup

production:
  send_reminder_messages:
    class: SendReminderMessagesJob
    schedule: every day at 7am

  dsgvo_cleanup:
    class: DsgvoCleanupJob
    schedule: every day at 3am

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
