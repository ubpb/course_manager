name: CI

on:
  pull_request:
  push:
    branches: [ master ]

# Cancel superseded runs when new commits are pushed in quick succession.
# Runs on master are never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # The version the servers run.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # config/database.yml picks these up so we talk to the MariaDB service via
      # TCP instead of the local socket used in development.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      # mise only sets up Bun, in the version of .mise.toml. Ruby comes from
      # setup-ruby, which caches the gems.
      MISE_ENABLE_TOOLS: bun

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential default-libmysqlclient-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Bun
        uses: jdx/mise-action@v5

      - name: Build assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run bin/ci
        run: bin/ci
