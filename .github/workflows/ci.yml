name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  # Daily on master, so that a newly published vulnerability in a gem or JS
  # package shows up in the audit steps without a commit.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# Cancel superseded runs when new commits are pushed in quick succession.
# Runs on master are never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The job only reads the code.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A run takes about two minutes; one that hangs should not take six hours.
    timeout-minutes: 15

    services:
      # The version the servers run.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # config/database.yml picks these up so we talk to the MariaDB service via
      # TCP instead of the local socket used in development.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      # mise only sets up Bun, in the version of .mise.toml. Ruby comes from
      # setup-ruby, which caches the gems.
      MISE_ENABLE_TOOLS: bun

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential default-libmysqlclient-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Bun
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Build assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run bin/ci
        run: bin/ci
