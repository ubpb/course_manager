<!doctype html>

<html lang="de">

  <head>

    <title>Wartungsarbeiten · Maintenance</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-size: clamp(1rem, 2.5vw, 2rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      #maintenance-icon {
        color: #0025AA;
      }

      hr {
        border: 0;
        border-top: 1px solid #E5E3E5;
        width: min(100%, 6em);
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101010;
          color: #E0E0E0;
        }

        #maintenance-icon {
          color: #6CB0F0;
        }

        hr {
          border-top-color: #2C2C2C;
        }
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main header {
        width: min(100%, 4em);
      }

      main header svg {
        height: auto;
        width: 100%;
      }

      main article {
        width: min(100%, 30em);
      }

      main article h1 {
        font-size: 100%;
        font-weight: 700;
        margin-bottom: 0.25em;
      }

      main article p {
        font-size: 75%;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/maintenance.html -->

    <main>
      <header>
        <svg id="maintenance-icon" aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </header>
      <article>
        <h1>Wartungsarbeiten</h1>
        <p>Wir führen gerade Wartungsarbeiten durch. Das System steht in Kürze wieder zur Verfügung. Bitte versuchen Sie es später noch einmal.</p>
      </article>
      <hr>
      <article lang="en">
        <h1>Maintenance</h1>
        <p>We are currently carrying out maintenance work. The system will be available again shortly. Please try again later.</p>
      </article>
    </main>

  </body>

</html>
